[package]
name = "contract-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
asset-hub-polkadot-runtime = { git = "https://github.com/polkadot-fellows/runtimes", rev = "b13287a4dfe15f71bd55cd7b4ea4c319768e28ad", default-features = false, features = ["std"] }

pallet-revive    = { version = "*" }
pallet-revive-uapi = { version = "*" }
pallet-referenda = { version = "*" }
pallet-preimage  = { version = "*" }
xcm              = { version = "*", package = "staging-xcm" }
frame-support    = { version = "*" }
frame-system     = { version = "*" }
pallet-balances  = { version = "*" }
sp-core          = { version = "*" }
sp-io            = { version = "*" }
sp-runtime       = { version = "*" }
codec            = { version = "*", package = "parity-scale-codec" }
scale-info       = { version = "*" }
contract         = { path = "../contract", features = ["std"] }
